name: docker-test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'website/**'
  workflow_dispatch:
    inputs:
      # there is an outage for gha cache - disabling for now
      enable_cache:
        description: 'Enable build cache'
        type: boolean
        default: false
        required: false

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.arch == 'arm64' && 'github-arm64-2c-8gb' || 'ubuntu-latest-16-cores' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        backend:
          - llama
          - llama-cuda # this tests cpu inference with cuda libraries present in the image
          - vllm-cpp-cpu
        arch:
          - amd64
          - arm64
        exclude:
          - backend: llama-cuda
            arch: arm64
        include:
          - backend: silero-vad
            arch: amd64
          - backend: rfdetr-cpp
            arch: amd64
          - backend: piper
            arch: amd64
          - backend: parakeet-cpp
            arch: amd64
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            auth.docker.io:443
            huggingface.co:443
            *.huggingface.co:443
            *.hf.co:443
            cdn.dl.k8s.io:443
            dl.k8s.io:443
            download.docker.com:443
            gcr.io:443
            github.com:443
            *.githubusercontent.com:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            storage.googleapis.com:443
            *.blob.core.windows.net:443
            *.azureedge.net:443
            developer.download.nvidia.com:443
            dl-cdn.alpinelinux.org:443
            *.ubuntu.com:80
            ghcr.io:443
            sum.golang.org:443
            quay.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # need containerd image store for testing local images
      - uses: crazy-max/ghaction-setup-docker@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: version=v27.5.1
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: ${{ matrix.arch == 'arm64' }}

      - name: build aikit
        run: |
          CACHE_FLAGS=""
          if [ "${{ github.event.inputs.enable_cache }}" = "true" ]; then
            CACHE_FLAGS="--cache-from=type=gha,scope=aikit-${{ matrix.arch }} --cache-to=type=gha,scope=aikit-${{ matrix.arch }},mode=max"
          fi
          docker buildx build . -t aikit:test \
            --load --provenance=false --progress plain \
            $CACHE_FLAGS \
            --platform linux/${{ matrix.arch }}

      - name: build test model
        run: |
          CACHE_FLAGS=""
          if [ "${{ github.event.inputs.enable_cache }}" = "true" ]; then
            CACHE_FLAGS="--cache-from=type=gha,scope=testmodel-${{ matrix.arch }} --cache-to=type=gha,scope=testmodel-${{ matrix.arch }},mode=max"
          fi
          docker buildx build . -t testmodel:test \
            -f test/aikitfile-${{ matrix.backend }}.yaml \
            --load --provenance=false --progress plain \
            $CACHE_FLAGS \
            --platform linux/${{ matrix.arch }} \
            ${{ matrix.backend == 'llama-cuda' && '--build-arg=runtime=cuda' || '' }}

      - name: list images
        run: docker images

      - name: run test model
        run: docker run --name testmodel -d -p 8080:8080 --platform "linux/${{ matrix.arch }}" testmodel:test

      - name: run llama test
        if: matrix.backend == 'llama' || matrix.backend == 'llama-cuda'
        run: |
          result=$(curl --fail --retry 10 --retry-all-errors http://127.0.0.1:8080/v1/chat/completions -H "Content-Type: application/json" -d '{
            "model": "llama-3.2-1b-instruct",
            "messages": [{"role": "user", "content": "explain kubernetes in a sentence"}]
          }')
          echo $result

          choices=$(echo "$result" | jq '.choices')
          if [ -z "$choices" ]; then
            exit 1
          fi

      - name: run tool calling test
        if: matrix.backend == 'llama' || matrix.backend == 'llama-cuda'
        run: |
          result=$(curl --fail --retry 10 --retry-all-errors http://127.0.0.1:8080/v1/chat/completions -H "Content-Type: application/json" -d '{
            "model": "llama-3.2-1b-instruct",
            "messages": [{"role": "user", "content": "What is the weather in Paris?"}],
            "tools": [{
              "type": "function",
              "function": {
                "name": "get_weather",
                "description": "Get the current weather for a location",
                "parameters": {
                  "type": "object",
                  "properties": {
                    "location": {"type": "string", "description": "The city name"}
                  },
                  "required": ["location"]
                }
              }
            }]
          }')
          echo "$result"

          tool_calls=$(echo "$result" | jq -r '.choices[0].message.tool_calls')
          if [ "$tool_calls" = "null" ] || [ -z "$tool_calls" ]; then
            echo "ERROR: No tool_calls in response"
            exit 1
          fi

          echo "Tool calling test passed"

      - name: run vllm-cpp chat correctness test
        if: matrix.backend == 'vllm-cpp-cpu'
        run: |
          result=$(curl --fail --show-error --max-time 300 --retry 10 --retry-all-errors \
            http://127.0.0.1:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen35-vllmcpp-smoke",
              "messages": [{"role": "user", "content": "What is the capital of France? Reply with only the city name."}],
              "max_tokens": 256,
              "temperature": 0
            }')
          echo "$result"
          echo "$result" | jq -e '
            .error == null and
            .object == "chat.completion" and
            .model == "qwen35-vllmcpp-smoke" and
            (.choices | length > 0) and
            .choices[0].finish_reason == "stop" and
            .choices[0].message.role == "assistant" and
            ((.choices[0].message.content // "") | gsub("^\\s+|\\s+$"; "") == "Paris")'

      - name: run Silero VAD test
        if: matrix.backend == 'silero-vad'
        run: |
          curl --fail --show-error --location --retry 5 --retry-all-errors \
            --output /tmp/speech.wav \
            https://raw.githubusercontent.com/mudler/parakeet.cpp/1bfbebfaaf493866f49597cd3b7901959d395c60/tests/fixtures/speech.wav
          echo "5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150  /tmp/speech.wav" | sha256sum --check

          ffmpeg -hide_banner -loglevel error -y -i /tmp/speech.wav \
            -ac 1 -ar 16000 -f f32le /tmp/speech.f32
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          audio = Path("/tmp/speech.f32").read_bytes()
          if len(audio) % 4 != 0:
              raise ValueError("float32 PCM byte count is not aligned")

          samples = struct.unpack(f"<{len(audio) // 4}f", audio)
          with Path("/tmp/vad-request.json").open("w", encoding="utf-8") as request:
              json.dump({"model": "silero-vad-smoke", "audio": samples}, request, separators=(",", ":"))
          PY

          curl --fail-with-body --show-error --max-time 300 --retry 10 --retry-all-errors \
            http://127.0.0.1:8080/v1/vad \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/vad-request.json \
            --output /tmp/vad-response.json
          jq . /tmp/vad-response.json
          jq -e '
            .error == null and
            (.segments | type == "array" and length > 0) and
            all(.segments[];
              (.start | type) == "number" and
              (.end | type) == "number" and
              .end > .start
            )' /tmp/vad-response.json

      - name: run RF-DETR detection test
        if: matrix.backend == 'rfdetr-cpp'
        run: |
          curl --fail --show-error --location --retry 5 --retry-all-errors \
            --output /tmp/detection.jpg \
            https://raw.githubusercontent.com/localai-org/rf-detr.cpp/98d0f381b832ef08a608b65c7dd78db066ed8b9a/tests/fixtures/ci/test_image.jpg
          echo "ff3a2092bf7a3a572903482e4d73a25576f0f1c13dd53f2f6b7bb3c20fb0119d  /tmp/detection.jpg" | sha256sum --check

          base64 --wrap=0 /tmp/detection.jpg > /tmp/detection.b64
          jq -n --rawfile image /tmp/detection.b64 \
            '{model: "rfdetr-smoke", image: ("data:image/jpeg;base64," + $image)}' \
            > /tmp/detection-request.json
          curl --fail-with-body --show-error --max-time 300 --retry 10 --retry-all-errors \
            http://127.0.0.1:8080/v1/detection \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/detection-request.json \
            --output /tmp/detection-response.json
          jq . /tmp/detection-response.json
          jq -e '
            .error == null and
            (.detections | type == "array" and length > 0) and
            any(.detections[];
              .class_name == "dog" and
              (.confidence | type) == "number" and
              .confidence > 0
            )' /tmp/detection-response.json

      - name: run Piper speech test
        if: matrix.backend == 'piper'
        run: |
          curl --fail-with-body --show-error --max-time 300 --retry 10 --retry-all-errors \
            http://127.0.0.1:8080/v1/audio/speech \
            -H "Content-Type: application/json" \
            -d '{
              "model": "piper-smoke",
              "input": "AIKit CPU smoke test.",
              "response_format": "wav"
            }' \
            --dump-header /tmp/piper-headers.txt \
            --output /tmp/piper.wav

          content_type=$(grep -i '^content-type:' /tmp/piper-headers.txt | tail -1 | tr -d '\r' | awk '{print $2}')
          case "${content_type,,}" in
            audio/wav*) ;;
            *) echo "unexpected content type: $content_type" >&2; exit 1 ;;
          esac
          test "$(stat --format=%s /tmp/piper.wav)" -gt 44
          test "$(head --bytes=4 /tmp/piper.wav)" = "RIFF"
          test "$(dd if=/tmp/piper.wav bs=1 skip=8 count=4 status=none)" = "WAVE"

      - name: run Parakeet transcription test
        if: matrix.backend == 'parakeet-cpp'
        run: |
          curl --fail --show-error --location --retry 5 --retry-all-errors \
            --output /tmp/speech.wav \
            https://raw.githubusercontent.com/mudler/parakeet.cpp/1bfbebfaaf493866f49597cd3b7901959d395c60/tests/fixtures/speech.wav
          echo "5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150  /tmp/speech.wav" | sha256sum --check

          ffmpeg -hide_banner -loglevel error -y -i /tmp/speech.wav \
            -ac 2 -ar 44100 -c:a pcm_s16le /tmp/speech-input.wav
          curl --fail-with-body --show-error --max-time 300 --retry 10 --retry-all-errors \
            http://127.0.0.1:8080/v1/audio/transcriptions \
            -F "file=@/tmp/speech-input.wav;type=audio/wav" \
            -F "model=parakeet-smoke" \
            -F "response_format=json" \
            --output /tmp/parakeet-response.json
          jq . /tmp/parakeet-response.json
          jq -e '
            .error == null and
            (.text | type == "string" and length > 0)' \
            /tmp/parakeet-response.json

      - name: save logs
        if: always()
        run: docker logs testmodel > /tmp/docker-${{ matrix.backend }}-${{ matrix.arch }}.log 2>&1

      - name: publish test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            /tmp/*.log
            /tmp/*-response.json
            /tmp/piper.wav
            /tmp/images/*.png

  test-protocol:
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        protocol:
          - oci
          - hf
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            auth.docker.io:443
            huggingface.co:443
            *.huggingface.co:443
            *.hf.co:443
            cdn.dl.k8s.io:443
            dl.k8s.io:443
            download.docker.com:443
            gcr.io:443
            github.com:443
            *.githubusercontent.com:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            storage.googleapis.com:443
            *.blob.core.windows.net:443
            *.azureedge.net:443
            *.ubuntu.com:80
            developer.download.nvidia.com:443
            dl-cdn.alpinelinux.org:443
            registry.ollama.ai:443
            *.cloudflarestorage.com:443
            ghcr.io:443
            sum.golang.org:443
            quay.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # need containerd image store for testing local images
      - uses: crazy-max/ghaction-setup-docker@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: version=v27.5.1
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: build aikit
        run: |
          CACHE_FLAGS=""
          if [ "${{ github.event.inputs.enable_cache }}" = "true" ]; then
            CACHE_FLAGS="--cache-from=type=gha,scope=aikit-amd64 --cache-to=type=gha,scope=aikit-amd64,mode=max"
          fi
          docker buildx build . -t aikit:test \
            --load --provenance=false --progress plain \
            $CACHE_FLAGS

      - name: build test model
        run: |
          CACHE_FLAGS=""
          if [ "${{ github.event.inputs.enable_cache }}" = "true" ]; then
            CACHE_FLAGS="--cache-from=type=gha,scope=testmodel-${{ matrix.protocol }} --cache-to=type=gha,scope=testmodel-${{ matrix.protocol }},mode=max"
          fi
          docker buildx build . -t testmodel:test \
            -f test/aikitfile-${{ matrix.protocol }}.yaml \
            --load --provenance=false --progress plain \
            $CACHE_FLAGS

      - name: list images
        run: docker images

      - name: run test model
        run: docker run --name testmodel -d -p 8080:8080 testmodel:test

      - name: run llama test
        run: |
          result=$(curl --fail --retry 10 --retry-all-errors http://127.0.0.1:8080/v1/chat/completions -H "Content-Type: application/json" -d '{
            "model": "llama-3.2-1b-instruct",
            "messages": [{"role": "user", "content": "explain kubernetes in a sentence"}]
          }')
          echo $result

          choices=$(echo "$result" | jq '.choices')
          if [ -z "$choices" ]; then
            exit 1
          fi

      - name: save logs
        if: always()
        run: docker logs testmodel > /tmp/docker-${{ matrix.protocol }}.log

      - name: publish test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-${{ matrix.protocol }}
          path: |
            /tmp/*.log
