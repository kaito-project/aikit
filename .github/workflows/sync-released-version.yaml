name: Sync released version to main
run-name: Sync ${{ github.ref_name }} to main

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.0'

permissions:
  contents: read

jobs:
  preflight:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/validate-release.sh "${GITHUB_REF_NAME}" "$(git rev-parse "${GITHUB_REF}^{commit}")"

  sync-version:
    needs: preflight
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Update version manifests
        env:
          NEWVERSION: ${{ github.ref_name }}
        run: make release-manifest

      - name: Create version sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: Sync ${{ github.ref_name }} version to main"
          title: "chore: Sync ${{ github.ref_name }} version to main"
          branch: "sync-${{ github.ref_name }}-to-main"
          base: main
          signoff: true
          labels: ${{ github.ref_name }}
