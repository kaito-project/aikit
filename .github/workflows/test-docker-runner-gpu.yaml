name: docker-test-runner-gpu

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Runner backend to test (leave empty to test all)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - llama-cpp-cuda
          - diffusers-cuda
          - parakeet-cpp-cuda
          - vllm-cuda

permissions: read-all

jobs:
  test:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        backend: ${{ inputs.backend == 'all' && fromJson('["llama-cpp-cuda", "diffusers-cuda", "parakeet-cpp-cuda", "vllm-cuda"]') || fromJson(format('["{0}"]', inputs.backend)) }}
    steps:
      - name: cleanup workspace
        run: |
          rm -rf ./* || true
          rm -rf ./.??* || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        # use default docker driver builder with containerd image store for local aikit image
        # these must be setup before running this test
      - run: docker buildx use default

      - name: build aikit
        run: |
          docker buildx build . -t aikit:test \
            --load --provenance=false --progress plain

      - name: build runner image
        run: |
          docker buildx build . -t runner-test:test \
            -f runners/${{ matrix.backend }}.yaml \
            --build-arg BUILDKIT_SYNTAX=aikit:test \
            --load --provenance=false --progress plain

      - name: list images
        run: docker images

      - name: verify minimal runtime contents
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          docker run --rm --entrypoint /bin/bash runner-test:test -c '
            set -euo pipefail
            if compgen -G "/var/lib/apt/lists/*" > /dev/null; then
              echo "APT indexes must not be retained in the final image" >&2
              exit 1
            fi
            test ! -d /root/.cache/pip
            test ! -e /usr/local/cuda
          '
          if [[ "$BACKEND" == diffusers-cuda || "$BACKEND" == vllm-cuda ]]; then
            docker run --rm --entrypoint /bin/bash runner-test:test -c 'test ! -x /usr/bin/python3'
          fi

      - name: run runner (llama-cpp-cuda)
        if: matrix.backend == 'llama-cpp-cuda'
        run: docker run --name runner-test -d --rm -p 8080:8080 --gpus all runner-test:test https://huggingface.co/unsloth/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q2_K.gguf

      - name: run runner (diffusers-cuda)
        if: matrix.backend == 'diffusers-cuda'
        run: docker run --name runner-test -d --rm -p 8080:8080 --gpus all runner-test:test stable-diffusion-v1-5/stable-diffusion-v1-5

      - name: run runner (parakeet-cpp-cuda)
        if: matrix.backend == 'parakeet-cpp-cuda'
        run: docker run --name runner-test -d --rm -p 8080:8080 --gpus all runner-test:test huggingface://mudler/parakeet-cpp-gguf@bf0af9f425fa01809cadec671b3cb672709d13e9/tdt_ctc-110m-q4_k.gguf

      - name: run runner (vllm-cuda)
        if: matrix.backend == 'vllm-cuda'
        run: docker run --name runner-test -d --rm -p 8080:8080 --gpus all runner-test:test Qwen/Qwen2.5-0.5B-Instruct

      - name: run test (llama-cpp-cuda)
        if: matrix.backend == 'llama-cpp-cuda'
        run: |
          result=$(curl --fail --retry 10 --retry-all-errors --retry-max-time 600 http://127.0.0.1:8080/v1/chat/completions -H "Content-Type: application/json" -d '{
            "model": "gemma-3-1b-it-Q2_K",
            "messages": [{"role": "user", "content": "explain kubernetes in a sentence"}]
          }')
          echo "$result"

          echo "$result" | jq -e '
            if (.error? != null) then
              error("error field present in response")
            elif ((.choices | type) != "array" or (.choices | length) == 0) then
              error("choices must be a non-empty array")
            else
              .
            end
          ' > /dev/null

      - name: run test (diffusers-cuda)
        if: matrix.backend == 'diffusers-cuda'
        run: |
          result=$(curl --fail --retry 10 --retry-all-errors --retry-max-time 600 http://127.0.0.1:8080/v1/images/generations -H "Content-Type: application/json" -d '{
            "model": "stable-diffusion-v1-5",
            "prompt": "A cute baby llama",
            "size": "256x256"
          }')
          echo "$result"

          echo "$result" | jq -e '
            if (.error? != null) then
              error("error field present in response")
            elif ((.data | type) != "array" or (.data | length) == 0) then
              error("data must be a non-empty array")
            elif (.data[0].url == null or .data[0].url == "") then
              error("data[0].url must be non-empty")
            else
              .
            end
          ' > /dev/null

      - name: save generated image
        if: matrix.backend == 'diffusers-cuda'
        run: docker cp runner-test:/tmp/generated/content/images /tmp || true

      - name: run test (parakeet-cpp-cuda)
        if: matrix.backend == 'parakeet-cpp-cuda'
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/parakeet-speech.wav \
            https://raw.githubusercontent.com/mudler/parakeet.cpp/1bfbebfaaf493866f49597cd3b7901959d395c60/tests/fixtures/speech.wav
          echo "5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150  /tmp/parakeet-speech.wav" | sha256sum --check
          docker run --rm \
            --volume /tmp:/fixtures \
            --entrypoint ffmpeg \
            runner-test:test \
            -y -i /fixtures/parakeet-speech.wav -ar 44100 -ac 2 -c:a pcm_s16le /fixtures/parakeet-speech-input.wav
          result=$(curl --fail --retry 10 --retry-all-errors --retry-max-time 600 \
            http://127.0.0.1:8080/v1/audio/transcriptions \
            -F "file=@/tmp/parakeet-speech-input.wav;type=audio/wav" \
            -F "model=tdt_ctc-110m-q4_k" \
            -F "response_format=json")
          echo "$result"
          echo "$result" | jq -e \
            --arg expected "Well, I don't wish to see it any more, observed Phoebe, turning away her eyes. It is certainly very like the old portrait." \
            '.error == null and .text == $expected'

      - name: run test (vllm-cuda)
        if: matrix.backend == 'vllm-cuda'
        run: |
          result=$(curl --fail --retry 10 --retry-all-errors --retry-max-time 600 http://127.0.0.1:8080/v1/chat/completions -H "Content-Type: application/json" -d '{
            "model": "Qwen2.5-0.5B-Instruct",
            "messages": [{"role": "user", "content": "explain kubernetes in a sentence"}]
          }')
          echo "$result"

          echo "$result" | jq -e '
            if (.error? != null) then
              error("error field present in response")
            elif ((.choices | type) != "array" or (.choices | length) == 0) then
              error("choices must be a non-empty array")
            else
              .
            end
          ' > /dev/null

      - name: save logs
        if: always()
        run: docker logs runner-test > /tmp/docker-runner-${{ matrix.backend }}.log 2>&1

      - run: docker stop runner-test
        if: always()

      - run: docker system prune -a -f --volumes || true
        if: always()

      - name: publish test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-runner-${{ matrix.backend }}
          path: |
            /tmp/*.log
            /tmp/images/*.png
