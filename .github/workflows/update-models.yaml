name: update-models

on:
  workflow_dispatch:
    inputs:
      staging:
        description: "push to test registry"
        required: false
        default: false
        type: boolean
      models:
        description: "JSON array of model IDs; [] updates all active presets"
        required: true
        default: '[]'
        type: string
      runtime:
        description: "runtime to build"
        required: true
        default: '["cuda", "applesilicon"]'
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.catalog.outputs.models }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select active presets
        id: catalog
        env:
          MODELS: ${{ inputs.models }}
        run: |
          models=$(bash scripts/parse-models.sh --models "$MODELS")
          echo "models=$models" >> "$GITHUB_OUTPUT"

  update-models:
    needs: prepare
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.prepare.outputs.models) }}
        runtime: ${{ fromJSON(inputs.runtime) }}
        exclude:
        - model: flux-2-klein-4b # Requires the CUDA runtime.
          runtime: applesilicon
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 360
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            auth.docker.io:443
            huggingface.co:443
            *.huggingface.co:443
            *.hf.co:443
            fulcio.sigstore.dev:443
            gcr.io:443
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            storage.googleapis.com:443
            tuf-repo-cdn.sigstore.dev:443
            *.azureedge.net:443
            *.blob.core.windows.net:443
            developer.download.nvidia.com:443
            *.ubuntu.com:80
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image metadata
        env:
          MODEL_ID: ${{ matrix.model }}
        run: bash scripts/parse-models.sh "$MODEL_ID" >> "$GITHUB_ENV"

      - name: Build and push
        env:
          MODEL_ID: ${{ matrix.model }}
          RUNTIME: ${{ matrix.runtime }}
          STAGING: ${{ inputs.staging }}
        run: |
          REGISTRY=ghcr.io/kaito-project/aikit
          if [ "$STAGING" = "true" ]; then
            REGISTRY="$REGISTRY/test"
          fi

          PLATFORMS="$MODEL_PLATFORMS"
          BUILD_ARGS=()
          case "$RUNTIME" in
            cuda) ;;
            applesilicon)
              REGISTRY="$REGISTRY/applesilicon"
              PLATFORMS=linux/arm64
              BUILD_ARGS=(--build-arg runtime=applesilicon)
              ;;
            *)
              echo "Unsupported publishing runtime: $RUNTIME" >&2
              exit 1
              ;;
          esac

          IMAGE="$REGISTRY/$MODEL_NAME"
          TAGS=(-t "$IMAGE:$MODEL_SIZE")
          if [ -n "$MODEL_ALIAS" ]; then
            TAGS+=(-t "$IMAGE:$MODEL_ALIAS")
          fi

          docker buildx build . \
            "${TAGS[@]}" \
            -f "models/$MODEL_ID.yaml" \
            --push --progress plain \
            --sbom=true --provenance=true \
            --platform "$PLATFORMS" "${BUILD_ARGS[@]}"
          DIGEST=$(cosign triangulate "$IMAGE:$MODEL_SIZE" --type digest)
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Sign the images with GitHub OIDC Token
        if: ${{ !inputs.staging }}
        run: cosign sign --yes ${DIGEST}

      - name: Verify image signature
        if: ${{ !inputs.staging }}
        run: |
          cosign verify ${DIGEST} \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp 'https://github\.com/kaito-project/aikit/\.github/workflows/.+'
