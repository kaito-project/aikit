name: unit-test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'website/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest-16-cores
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443
            download-r2.pytorch.org:443
            download.pytorch.org:443
            files.pythonhosted.org:443
            pypi.org:443
            proxy.golang.org:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      - name: Install uv 0.12.1
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false
          download-from-astral-mirror: false

      - name: Check Unsloth dependency lock
        run: make check-unsloth-lock

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Go unit tests
        run: make test

      - name: Install Python dataset test dependencies
        run: |
          uv venv --python python3 .venv
          uv pip install --python .venv/bin/python \
            --exclude-newer 2026-08-05T00:00:00Z \
            "datasets==4.3.0" \
            "fsspec==2025.9.0" \
            "huggingface-hub==1.26.0" \
            "numpy==2.2.6" \
            "pandas==2.3.3" \
            "pyarrow==25.0.0"

      - name: Python unit tests
        run: PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" make test-python

      - name: Test image size checker
        run: scripts/ci/check-image-size_test.sh

  llb-benchmark:
    name: llb-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443
            proxy.golang.org:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      - name: Check LLB graph benchmark budgets
        run: scripts/ci/check-llb-benchmark.sh /tmp/llb-benchmark.txt

      - name: Publish LLB benchmark artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llb-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/llb-benchmark.txt
          if-no-files-found: warn
          retention-days: 14
