name: docker-test-runner

on:
  push:
    paths-ignore:
      - '**.md'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'website/**'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: test (${{ matrix.runner }})
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: llama-cpp-cpu
            test_type: chat
            model_ref: https://huggingface.co/unsloth/gemma-3-1b-it-GGUF/resolve/f0b45be0aac41bd6a100a4b5734cad5f67255bfb/gemma-3-1b-it-Q2_K.gguf
            model_name: gemma-3-1b-it-Q2_K
            prompt: explain kubernetes in a sentence
            max_tokens: 64
            expected_content: ""
          - runner: vllm-cpp-cpu
            test_type: chat
            model_ref: Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca
            model_name: Qwen3-0.6B
            prompt: What is the capital of France? Reply with only the city name. /no_think
            max_tokens: 256
            expected_content: Paris
          - runner: parakeet-cpp-cpu
            test_type: transcription
            model_ref: huggingface://mudler/parakeet-cpp-gguf@bf0af9f425fa01809cadec671b3cb672709d13e9/tdt_ctc-110m-q4_k.gguf
            model_name: tdt_ctc-110m-q4_k
            audio_ref: https://raw.githubusercontent.com/mudler/parakeet.cpp/1bfbebfaaf493866f49597cd3b7901959d395c60/tests/fixtures/speech.wav
            audio_sha256: 5fceacff0315d49cb59fcc505bcecf1ed5f2f35c2897b1e65a59f30e5d922150
            expected_content: "Well, I don't wish to see it any more, observed Phoebe, turning away her eyes. It is certainly very like the old portrait."
    env:
      AUDIO_REF: ${{ matrix.audio_ref }}
      AUDIO_SHA256: ${{ matrix.audio_sha256 }}
      EXPECTED_CONTENT: ${{ matrix.expected_content }}
      MAX_TOKENS: ${{ matrix.max_tokens }}
      MODEL_NAME: ${{ matrix.model_name }}
      MODEL_PROMPT: ${{ matrix.prompt }}
      MODEL_REF: ${{ matrix.model_ref }}
      RUNNER: ${{ matrix.runner }}
      TEST_TYPE: ${{ matrix.test_type }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            auth.docker.io:443
            huggingface.co:443
            *.huggingface.co:443
            *.hf.co:443
            cdn.dl.k8s.io:443
            dl.k8s.io:443
            download.docker.com:443
            gcr.io:443
            github.com:443
            *.githubusercontent.com:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            storage.googleapis.com:443
            *.blob.core.windows.net:443
            *.azureedge.net:443
            developer.download.nvidia.com:443
            dl-cdn.alpinelinux.org:443
            *.ubuntu.com:80
            ghcr.io:443
            sum.golang.org:443
            quay.io:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # need containerd image store for testing local images
      - uses: crazy-max/ghaction-setup-docker@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: version=v27.5.1
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: build aikit
        run: |
          docker buildx build . -t aikit:test \
            --load --provenance=false --progress plain

      - name: build runner image
        run: |
          docker buildx build . -t runner-test:test \
            -f "runners/${RUNNER}.yaml" \
            --build-arg BUILDKIT_SYNTAX=aikit:test \
            --load --provenance=false --progress plain

      - name: list images
        run: docker images

      - name: verify minimal runtime contents
        run: |
          docker run --rm --entrypoint /bin/bash runner-test:test -c '
            set -euo pipefail
            if compgen -G "/var/lib/apt/lists/*" > /dev/null; then
              echo "APT indexes must not be retained in the final image" >&2
              exit 1
            fi
            test ! -d /root/.cache/pip
            test ! -e /usr/local/cuda
          '
          if [[ "$TEST_TYPE" == "transcription" ]]; then
            docker run --rm --entrypoint ffmpeg runner-test:test -version
          fi

      - name: download transcription fixture
        if: matrix.test_type == 'transcription'
        run: |
          curl --fail --location --retry 3 --output /tmp/parakeet-speech.wav "$AUDIO_REF"
          echo "$AUDIO_SHA256  /tmp/parakeet-speech.wav" | sha256sum --check
          docker run --rm \
            --volume /tmp:/fixtures \
            --entrypoint ffmpeg \
            runner-test:test \
            -y -i /fixtures/parakeet-speech.wav -ar 44100 -ac 2 -c:a pcm_s16le /fixtures/parakeet-speech-input.wav

      - name: run runner with model
        run: |
          extra_args=()
          if [[ "$TEST_TYPE" == "chat" ]]; then
            extra_args+=(--context-size 1024)
          fi
          docker run --name runner-test -d -p 8080:8080 runner-test:test "$MODEL_REF" "${extra_args[@]}"

      - name: wait for model download
        run: |
          echo "Waiting for runner container to download model and start..."
          ready=false
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/readyz 2>/dev/null | grep -q "200"; then
              echo "Server is ready!"
              ready=true
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -q runner-test; then
              echo "Container exited unexpectedly!"
              docker logs runner-test 2>&1 || true
              exit 1
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "Still waiting... ($((i * 10))s elapsed)"
              docker logs --tail 5 runner-test 2>&1 || true
            fi
            sleep 10
          done
          if [[ "$ready" != "true" ]]; then
            echo "Runner did not become ready within 10 minutes" >&2
            docker logs runner-test 2>&1 || true
            exit 1
          fi

      - name: run chat completion test
        if: matrix.test_type == 'chat'
        run: |
          payload=$(jq -n \
            --arg model "$MODEL_NAME" \
            --arg prompt "$MODEL_PROMPT" \
            --argjson max_tokens "$MAX_TOKENS" \
            '{model: $model, messages: [{role: "user", content: $prompt}], max_tokens: $max_tokens, temperature: 0}')
          response=""
          for i in $(seq 1 30); do
            response=$(curl --fail --silent --show-error --max-time 300 http://127.0.0.1:8080/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d "$payload") && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [[ -z "$response" ]]; then
            echo "Chat completion did not return a response" >&2
            exit 1
          fi
          echo "$response"
          echo "$response" | jq -e --arg model "$MODEL_NAME" \
            '.error == null and .object == "chat.completion" and .model == $model and (.choices | length > 0) and
             .choices[0].message.role == "assistant"'
          if [[ -n "$EXPECTED_CONTENT" ]]; then
            echo "$response" | jq -e --arg expected "$EXPECTED_CONTENT" \
              '.choices[0].finish_reason == "stop" and
               ((.choices[0].message.content // "") | gsub("^\\s+|\\s+$"; "") == $expected)'
          else
            echo "$response" | jq -e \
              '(((.choices[0].message.content // "") | type == "string" and length > 0) or
               ((.choices[0].message.reasoning_content // .choices[0].message.reasoning // "") | type == "string" and length > 0))'
          fi

      - name: run transcription test
        if: matrix.test_type == 'transcription'
        run: |
          response=""
          for i in $(seq 1 10); do
            response=$(curl --fail --silent --show-error --max-time 300 \
              http://127.0.0.1:8080/v1/audio/transcriptions \
              -F "file=@/tmp/parakeet-speech-input.wav;type=audio/wav" \
              -F "model=$MODEL_NAME" \
              -F "response_format=json") && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [[ -z "$response" ]]; then
            echo "Transcription did not return a response" >&2
            exit 1
          fi
          echo "$response"
          echo "$response" | jq -e --arg expected "$EXPECTED_CONTENT" \
            '.error == null and .text == $expected'

      - name: save logs
        if: always()
        run: docker logs runner-test > "/tmp/docker-runner-${RUNNER}.log" 2>&1 || true

      - name: remove container
        if: always()
        run: docker rm -f runner-test || true

      - name: publish test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-runner-${{ matrix.runner }}
          path: /tmp/docker-runner-${{ matrix.runner }}.log

  test:
    name: test
    if: always()
    needs: runner
    runs-on: ubuntu-latest
    steps:
      - name: verify runner tests
        env:
          RESULT: ${{ needs.runner.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "Runner test matrix result: $RESULT" >&2
            exit 1
          fi
