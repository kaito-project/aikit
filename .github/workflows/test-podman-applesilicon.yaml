name: podman-test-gpu

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to test'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - llama
          - qwen3-tts

permissions: read-all

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: ${{ inputs.model == 'all' && fromJson('["llama", "qwen3-tts"]') || fromJson(format('["{0}"]', inputs.model)) }}
    steps:
      - name: cleanup workspace
        run: |
          rm -rf ./* || true
          rm -rf ./.??* || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        # use default docker driver builder with containerd image store for local aikit image
        # these must be setup before running this test
      - run: docker buildx use desktop-linux

      - name: build aikit
        run: |
          docker buildx build . -t aikit:test \
            --load --provenance=false --progress plain

      - name: build and push test model
        if: matrix.model == 'llama'
        run: |
          docker buildx build . -t sozercan/testmodel:test \
            --push \
            -f test/aikitfile-llama-applesilicon.yaml \
            --provenance=false --progress plain \
            --platform "linux/arm64"

      - name: build Qwen3-TTS for Apple Silicon
        if: matrix.model == 'qwen3-tts'
        run: |
          docker buildx build . -t localhost/qwen3-tts:test \
            -f models/qwen3-tts-1.7b-base.yaml \
            --build-arg BUILDKIT_SYNTAX=aikit:test \
            --build-arg runtime=applesilicon \
            --platform linux/arm64 --provenance=false --progress plain \
            --output "type=docker,dest=$RUNNER_TEMP/qwen3-tts.tar"
          podman load -i "$RUNNER_TEMP/qwen3-tts.tar"

      - name: test Qwen3-TTS speech and GPU offload
        if: matrix.model == 'qwen3-tts'
        timeout-minutes: 15
        run: bash scripts/ci/test-qwen3-tts.sh podman localhost/qwen3-tts:test "$RUNNER_TEMP/qwen3-tts"

      - name: list images
        run: docker images

      - name: run test model
        if: matrix.model == 'llama'
        run: |
          podman run --name testmodel -d --rm -p 8080:8080 \
            --device /dev/dri \
            --pull always \
            sozercan/testmodel:test

      - name: run test (gguf)
        if: matrix.model == 'llama'
        run: |
          result=$(curl --fail --retry 10 --retry-all-errors http://localhost:8080/v1/chat/completions -H "Content-Type: application/json" -d '{
            "model": "llama-3.2-1b-instruct",
            "messages": [{"role": "user", "content": "Explain Kubernetes in one sentence."}],
            "temperature": 0,
            "max_tokens": 64
          }')
          echo "$result"

          echo "$result" | jq -e '
            .object == "chat.completion" and
            (.usage.completion_tokens > 0) and
            (.choices[0].message.content | type == "string" and length > 0)
          '
          podman logs testmodel > /tmp/podman-gpu.log 2>&1
          grep -E 'using device Vulkan[0-9]+ \(Virtio-GPU Venus.*Apple' /tmp/podman-gpu.log
          grep -E 'offloaded [1-9][0-9]*/[1-9][0-9]* layers to GPU' /tmp/podman-gpu.log

      - name: save logs
        if: always() && matrix.model == 'llama'
        run: podman logs testmodel > /tmp/podman-gpu.log 2>&1

      - run: podman stop testmodel
        if: always() && matrix.model == 'llama'

      # - name: prune
      #   run: |
      #     docker system prune -a -f --volumes || true
      #     podman system prune -a -f --volumes || true
      #   if: always()

      - name: publish test artifacts
        if: always() && matrix.model == 'llama'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-podman-gpu
          path: |
            /tmp/*.log

      - name: publish Qwen3-TTS test artifacts
        if: always() && matrix.model == 'qwen3-tts'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-podman-qwen3-tts
          path: ${{ runner.temp }}/qwen3-tts/
