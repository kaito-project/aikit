name: Reconcile release latest

on:
  workflow_run:
    workflows:
      - Release artifacts
      - Release runner images
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-app:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Release artifacts')
    environment: release-automation
    permissions:
      actions: read
      contents: write
      packages: write
    concurrency:
      group: reconcile-release-latest-app
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            rekor.sigstore.dev:443
            storage.googleapis.com:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select latest successful app release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_json=$(mktemp)
          remote_tags=$(mktemp)
          trap 'rm -f "${runs_json}" "${remote_tags}"' EXIT

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yaml/runs?event=push&status=completed&per_page=100" \
            >"${runs_json}"
          git ls-remote --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' \
            >"${remote_tags}"
          scripts/ci/select-latest-release.sh \
            "${GITHUB_REPOSITORY}" .github/workflows/release.yaml \
            "${runs_json}" "${remote_tags}"

      - name: Install Cosign
        if: steps.release.outputs.found == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        if: steps.release.outputs.found == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        if: steps.release.outputs.found == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify app release is ready
        if: steps.release.outputs.found == 'true'
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image=ghcr.io/kaito-project/aikit/aikit
          digest=$(docker buildx imagetools inspect "${image}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | jq -er 'select(type == "string")')
          if ! [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Registry returned an invalid digest for ${image}:${VERSION}." >&2
            exit 1
          fi

          cosign verify "${image}@${digest}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity \
              "https://github.com/kaito-project/aikit/.github/workflows/release.yaml@refs/tags/${VERSION}"

          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}")
          release_id=$(jq -er \
            --arg version "${VERSION}" \
            'select(.tag_name == $version and .draft == false and .prerelease == false) | .id' \
            <<<"${release_json}")
          if ! [[ ${release_id} =~ ^[0-9]+$ ]]; then
            echo "GitHub returned an invalid stable release for ${VERSION}." >&2
            exit 1
          fi

          {
            echo "digest=${digest}"
            echo "release_id=${release_id}"
          } >>"${GITHUB_OUTPUT}"

      - name: Reconcile app and GitHub Latest
        if: steps.release.outputs.found == 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.image.outputs.release_id }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image=ghcr.io/kaito-project/aikit/aikit
          docker buildx imagetools create --prefer-index=false \
            --tag "${image}:latest" "${image}@${DIGEST}"
          cosign verify "${image}:latest" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity \
              "https://github.com/kaito-project/aikit/.github/workflows/release.yaml@refs/tags/${VERSION}"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f make_latest=true >/dev/null
          echo "Promoted app and GitHub Latest to ${VERSION}." >>"${GITHUB_STEP_SUMMARY}"

      - name: Report no successful app release
        if: steps.release.outputs.found != 'true'
        run: echo "No successful stable app release is ready for promotion." >>"${GITHUB_STEP_SUMMARY}"

  reconcile-runners:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Release runner images')
    environment: release-automation
    permissions:
      actions: read
      contents: read
      packages: write
    concurrency:
      group: reconcile-release-latest-runners
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            rekor.sigstore.dev:443
            storage.googleapis.com:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select latest successful runner release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_json=$(mktemp)
          remote_tags=$(mktemp)
          trap 'rm -f "${runs_json}" "${remote_tags}"' EXIT

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-runners.yaml/runs?event=push&status=completed&per_page=100" \
            >"${runs_json}"
          git ls-remote --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' \
            >"${remote_tags}"
          scripts/ci/select-latest-release.sh \
            "${GITHUB_REPOSITORY}" .github/workflows/release-runners.yaml \
            "${runs_json}" "${remote_tags}"

      - name: Install Cosign
        if: steps.release.outputs.found == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        if: steps.release.outputs.found == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        if: steps.release.outputs.found == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify every runner release is ready
        if: steps.release.outputs.found == 'true'
        id: images
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image_plan="${RUNNER_TEMP}/runner-images"
          : >"${image_plan}"
          runners=(
            llama-cpp-cpu
            llama-cpp-cuda
            diffusers-cuda
            vllm-cuda
            vllm-cpp-cpu
            vllm-cpp-cuda
          )

          for runner in "${runners[@]}"; do
            image="ghcr.io/kaito-project/aikit/runners/${runner}"
            digest=$(docker buildx imagetools inspect "${image}:${VERSION}" \
              --format '{{json .Manifest.Digest}}' | jq -er 'select(type == "string")')
            if ! [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Registry returned an invalid digest for ${image}:${VERSION}." >&2
              exit 1
            fi
            cosign verify "${image}@${digest}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity \
                "https://github.com/kaito-project/aikit/.github/workflows/release-runners.yaml@refs/tags/${VERSION}"
            printf '%s\t%s\n' "${runner}" "${digest}" >>"${image_plan}"
          done

          echo "plan=${image_plan}" >>"${GITHUB_OUTPUT}"

      - name: Reconcile every runner latest alias
        if: steps.release.outputs.found == 'true'
        env:
          IMAGE_PLAN: ${{ steps.images.outputs.plan }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r runner digest; do
            image="ghcr.io/kaito-project/aikit/runners/${runner}"
            docker buildx imagetools create --prefer-index=false \
              --tag "${image}:latest" "${image}@${digest}"
          done <"${IMAGE_PLAN}"

          while IFS=$'\t' read -r runner _; do
            image="ghcr.io/kaito-project/aikit/runners/${runner}"
            cosign verify "${image}:latest" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity \
                "https://github.com/kaito-project/aikit/.github/workflows/release-runners.yaml@refs/tags/${VERSION}"
          done <"${IMAGE_PLAN}"
          echo "Promoted every runner latest alias to ${VERSION}." >>"${GITHUB_STEP_SUMMARY}"

      - name: Report no successful runner release
        if: steps.release.outputs.found != 'true'
        run: echo "No successful stable runner release is ready for promotion." >>"${GITHUB_STEP_SUMMARY}"
