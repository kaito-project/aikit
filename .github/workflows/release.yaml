name: Release artifacts

on:
  push:
    tags:
      - v*

concurrency:
  group: release-artifacts
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  preflight:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate release version policy
        run: scripts/ci/validate-release-version.sh "${GITHUB_REF_NAME}" existing

      - name: Validate release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/validate-release.sh "${GITHUB_REF_NAME}" "$(git rev-parse "${GITHUB_REF}^{commit}")"

  release:
    needs: preflight
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 360
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            get.helm.sh:443
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            *.blob.core.windows.net:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            storage.googleapis.com:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kaito-project/aikit/aikit
          flavor: latest=false
          tags: type=raw,value=candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set LDFLAGS
        run: |
          set -euo pipefail
          echo "LDFLAGS=-X github.com/kaito-project/aikit/pkg/version.Version=${GITHUB_REF_NAME}" >>"${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-and-push
        with:
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=aikit
          cache-to: type=gha,scope=aikit,mode=max
          sbom: true
          provenance: true
          build-args: |
            LDFLAGS=${{ env.LDFLAGS }}
          platforms: linux/amd64,linux/arm64
        env:
          LDFLAGS: ${{ env.LDFLAGS }}

      - name: Sign the images with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign sign --yes \
            -a release-artifact=aikit \
            -a "release-commit=${GITHUB_SHA}" \
            -a "release-run-attempt=${GITHUB_RUN_ATTEMPT}" \
            -a "release-run-id=${GITHUB_RUN_ID}" \
            "ghcr.io/kaito-project/aikit/aikit@${DIGEST}"

      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign verify "ghcr.io/kaito-project/aikit/aikit@${DIGEST}" \
            -a release-artifact=aikit \
            -a "release-commit=${GITHUB_SHA}" \
            -a "release-run-attempt=${GITHUB_RUN_ATTEMPT}" \
            -a "release-run-id=${GITHUB_RUN_ID}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/kaito-project/aikit/.github/workflows/release.yaml@${GITHUB_REF}"

      - name: Package Helm chart candidate
        id: chart
        env:
          HELM_ARCHIVE_SHA256: bf56beb418bb529b5e0d6d43d56654c5a03f89c98400b409d1013a33d9586474
          HELM_VERSION: v3.10.0
        run: |
          set -euo pipefail
          chart_entry_count=0
          while IFS= read -r -d '' entry; do
            metadata=${entry%%$'\t'*}
            read -r mode type _ <<<"${metadata}"
            if [[ ${type} != blob || \
              ( ${mode} != 100644 && ${mode} != 100755 ) ]]; then
              echo "Helm chart contains a non-regular entry: ${entry#*$'\t'}" >&2
              exit 1
            fi
            chart_entry_count=$((chart_entry_count + 1))
          done < <(git ls-tree -rz "${GITHUB_SHA}" -- charts/aikit)
          if ((chart_entry_count == 0)) || \
            ! git cat-file -e "${GITHUB_SHA}:charts/aikit/Chart.yaml"; then
            echo "Release commit ${GITHUB_SHA} does not contain the AIKit Helm chart." >&2
            exit 1
          fi

          helm_archive="${RUNNER_TEMP}/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            --output "${helm_archive}"
          downloaded_sha256=$(sha256sum "${helm_archive}" | awk '{print $1}')
          if [[ ${downloaded_sha256} != "${HELM_ARCHIVE_SHA256}" ]]; then
            echo "Helm archive digest ${downloaded_sha256} did not match the pinned digest." >&2
            exit 1
          fi
          helm_dir="${RUNNER_TEMP}/helm-${HELM_VERSION}"
          mkdir "${helm_dir}"
          tar -xzf "${helm_archive}" -C "${helm_dir}" linux-amd64/helm
          helm_bin="${helm_dir}/linux-amd64/helm"
          if [[ ! -x ${helm_bin} ]]; then
            echo "Verified Helm archive did not contain an executable Helm binary." >&2
            exit 1
          fi

          chart_version=${GITHUB_REF_NAME#v}
          chart_dir="${RUNNER_TEMP}/helm-chart-candidate"
          mkdir "${chart_dir}"
          "${helm_bin}" package charts/aikit --destination "${chart_dir}"
          chart_package="${chart_dir}/aikit-${chart_version}.tgz"
          if [[ ! -f ${chart_package} || -L ${chart_package} ]]; then
            echo "Helm did not produce the expected regular package ${chart_package}." >&2
            exit 1
          fi
          metadata=$("${helm_bin}" show chart "${chart_package}")
          for expected_line in \
            'name: aikit' \
            "version: ${chart_version}" \
            "appVersion: ${GITHUB_REF_NAME}"; do
            if [[ $(grep -Fxc -- "${expected_line}" <<<"${metadata}") -ne 1 ]]; then
              echo "Packaged chart metadata does not contain exactly one ${expected_line}." >&2
              exit 1
            fi
          done
          echo "package=${chart_package}" >>"${GITHUB_OUTPUT}"

      - name: Upload Helm chart candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.chart.outputs.package }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
