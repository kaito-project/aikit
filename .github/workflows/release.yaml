name: Release artifacts

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  preflight:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate release version policy
        run: scripts/ci/validate-release-version.sh "${GITHUB_REF_NAME}" existing

      - name: Validate release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/validate-release.sh "${GITHUB_REF_NAME}" "$(git rev-parse "${GITHUB_REF}^{commit}")"

  release:
    needs: preflight
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 360
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            storage.googleapis.com:443
            tuf-repo-cdn.sigstore.dev:443
            get.helm.sh:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kaito-project/aikit/aikit
          flavor: latest=false
          tags: type=semver,pattern={{raw}}

      - name: Set LDFLAGS
        run: |
          set -euo pipefail
          echo "LDFLAGS=-X github.com/kaito-project/aikit/pkg/version.Version=${GITHUB_REF_NAME}" >>"${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-and-push
        with:
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=aikit
          cache-to: type=gha,scope=aikit,mode=max
          sbom: true
          provenance: true
          build-args: |
            LDFLAGS=${{ env.LDFLAGS }}
          platforms: linux/amd64,linux/arm64
        env:
          LDFLAGS: ${{ env.LDFLAGS }}

      - name: Sign the images with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/kaito-project/aikit/aikit@${DIGEST}"

      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign verify "ghcr.io/kaito-project/aikit/aikit@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/kaito-project/aikit/.github/workflows/release.yaml@${GITHUB_REF}"

      - name: Publish latest image tag when current
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          policy_output=$(mktemp)
          trap 'rm -f "${policy_output}"' EXIT
          GITHUB_OUTPUT="${policy_output}" \
            scripts/ci/validate-release-version.sh "${GITHUB_REF_NAME}" existing >/dev/null
          publish_latest=$(awk -F= '$1 == "publish_latest" { print $2 }' "${policy_output}")

          if [[ ${publish_latest} == true ]]; then
            docker buildx imagetools create --prefer-index=false \
              --tag ghcr.io/kaito-project/aikit/aikit:latest \
              "ghcr.io/kaito-project/aikit/aikit@${DIGEST}"
            cosign verify ghcr.io/kaito-project/aikit/aikit:latest \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/kaito-project/aikit/.github/workflows/release.yaml@${GITHUB_REF}"
            echo "Published latest from ${GITHUB_REF_NAME}." >>"${GITHUB_STEP_SUMMARY}"
          elif [[ ${publish_latest} == false ]]; then
            echo "Skipped latest because a newer stable release exists." >>"${GITHUB_STEP_SUMMARY}"
          else
            echo "Release version validator returned an invalid publish_latest value." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          policy_output=$(mktemp)
          trap 'rm -f "${policy_output}"' EXIT
          GITHUB_OUTPUT="${policy_output}" \
            scripts/ci/validate-release-version.sh "${GITHUB_REF_NAME}" existing >/dev/null
          publish_latest=$(awk -F= '$1 == "publish_latest" { print $2 }' "${policy_output}")
          if ! [[ ${publish_latest} =~ ^(true|false)$ ]]; then
            echo "Release version validator returned an invalid publish_latest value." >&2
            exit 1
          fi

          if release_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.id' 2>/dev/null); then
            if ! [[ ${release_id} =~ ^[0-9]+$ ]]; then
              echo "GitHub returned an invalid release ID for ${GITHUB_REF_NAME}." >&2
              exit 1
            fi
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f "make_latest=${publish_latest}" >/dev/null
            echo "Updated the existing GitHub release; Latest is ${publish_latest}." >>"${GITHUB_STEP_SUMMARY}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}" \
              --latest="${publish_latest}"
            echo "Created the GitHub release atomically with Latest set to ${publish_latest}." >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Publish Helm chart
        uses: stefanprodan/helm-gh-pages@0ad2bb377311d61ac04ad9eb6f252fb68e207260 # v1.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: charts
          target_dir: charts
          linting: off
