name: docker-test-finetune

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fine-tune coverage to run.
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full

permissions: read-all

jobs:
  test:
    name: fine-tune (${{ inputs.mode }})
    runs-on: [self-hosted, gpu]
    timeout-minutes: 360
    env:
      BUILDX_BUILDER: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Prepare unique run resources
        shell: bash
        run: |
          set -euo pipefail

          run_mode="${{ inputs.mode }}"
          case "$run_mode" in
            smoke|full) ;;
            *)
              echo "unsupported fine-tune mode: $run_mode" >&2
              exit 1
              ;;
          esac

          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${run_mode}"
          {
            echo "RUN_MODE=$run_mode"
            echo "RUN_KEY=$run_key"
            echo "AIKIT_IMAGE=aikit:finetune-$run_key"
            echo "CUSTOM_IMAGE=custommodel:finetune-$run_key"
            echo "CONTAINER_NAME=aikit-finetune-$run_key"
            echo "OUTPUT_DIR=${RUNNER_TEMP}/aikit-finetune-$run_key-output"
            echo "FINETUNE_CONFIG=${RUNNER_TEMP}/aikit-finetune-$run_key.yaml"
            echo "CUSTOM_CONFIG=${RUNNER_TEMP}/aikit-finetune-$run_key-custom.yaml"
            echo "CONTAINER_LOG_FILE=${RUNNER_TEMP}/aikit-finetune-$run_key-container.log"
            echo "INFERENCE_LOG_FILE=${RUNNER_TEMP}/aikit-finetune-$run_key-inference.log"
            echo "DATASET_LOG_FILE=${RUNNER_TEMP}/aikit-finetune-$run_key-dataset.log"
            echo "DATASET_CONTAINER_NAME=aikit-finetune-$run_key-dataset"
            echo "DATASET_SERVER_IMAGE=busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0"
            echo "SMOKE_DATASET_FILE=${GITHUB_WORKSPACE}/test/fixtures/alpaca-smoke.jsonl"
          } >> "$GITHUB_ENV"

      - name: Verify GPU and builder
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          driver_version=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -n 1)
          test -n "$driver_version"
          echo "NVIDIA_DRIVER_VERSION=$driver_version" >> "$GITHUB_ENV"
          docker buildx inspect "$BUILDX_BUILDER" --bootstrap

      - name: Start local smoke dataset server
        if: inputs.mode == 'smoke'
        shell: bash
        run: |
          set -euo pipefail

          test -s "$SMOKE_DATASET_FILE"
          dataset_directory=$(dirname -- "$SMOKE_DATASET_FILE")
          docker run \
            --name "$DATASET_CONTAINER_NAME" \
            --detach \
            --publish 0.0.0.0::8080 \
            --volume "$dataset_directory:/srv:ro" \
            "$DATASET_SERVER_IMAGE" \
            httpd -f -v -p 8080 -h /srv > /dev/null

          dataset_port=""
          for _ in $(seq 1 100); do
            dataset_port=$(docker port "$DATASET_CONTAINER_NAME" 8080/tcp 2>/dev/null | sed -n '1s/.*:\([0-9][0-9]*\)$/\1/p' || true)
            if [[ -n "$dataset_port" ]]; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$DATASET_CONTAINER_NAME" 2>/dev/null || true)" != "true" ]]; then
              docker logs "$DATASET_CONTAINER_NAME" >&2 || true
              exit 1
            fi
            sleep 0.1
          done

          test -n "$dataset_port"
          host_ip=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i <= NF; i++) if ($i == "src") {print $(i + 1); exit}}')
          test -n "$host_ip"
          dataset_url="http://${host_ip}:${dataset_port}/$(basename "$SMOKE_DATASET_FILE")"
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 30 "$dataset_url" --output /dev/null
          echo "SMOKE_DATASET_URL=$dataset_url" >> "$GITHUB_ENV"

      - name: Generate mode-specific configs
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          case "$RUN_MODE" in
            smoke)
              source_config="$GITHUB_WORKSPACE/test/aikitfile-unsloth-smoke.yaml"
              dataset_url="${SMOKE_DATASET_URL:?smoke dataset URL is required}"
              ;;
            full)
              source_config="$GITHUB_WORKSPACE/test/aikitfile-unsloth.yaml"
              dataset_url=""
              ;;
          esac

          dataset_placeholder="__AIKIT_SMOKE_DATASET_URL__"
          gguf_placeholder="__AIKIT_GGUF_OUTPUT__"

          placeholder_count() {
            local source_path=$1
            local placeholder=$2

            awk -v placeholder="$placeholder" '
              NR == 1 { next }
              {
                line = $0
                while ((position = index(line, placeholder)) != 0) {
                  count++
                  line = substr(line, position + length(placeholder))
                }
              }
              END { print count + 0 }
            ' "$source_path"
          }

          render_config() {
            local source_path=$1
            local output_path=$2
            local placeholder=$3
            local replacement=$4
            local expected_count=$5
            local syntax_line
            local actual_count

            IFS= read -r syntax_line < "$source_path" || true
            if [[ "$syntax_line" != "#syntax="* ]]; then
              echo "$source_path must begin with a #syntax directive" >&2
              return 1
            fi

            actual_count=$(placeholder_count "$source_path" "$placeholder")
            if (( actual_count != expected_count )); then
              echo "$source_path must contain exactly $expected_count occurrences of $placeholder" >&2
              return 1
            fi

            awk \
              -v image="$AIKIT_IMAGE" \
              -v placeholder="$placeholder" \
              -v replacement="$replacement" '
              function replace_literal(line, token, value, position, rendered) {
                rendered = ""
                while ((position = index(line, token)) != 0) {
                  rendered = rendered substr(line, 1, position - 1) value
                  line = substr(line, position + length(token))
                }
                return rendered line
              }
              NR == 1 {
                print "#syntax=" image
                next
              }
              {
                print replace_literal($0, placeholder, replacement)
              }
            ' "$source_path" > "$output_path"
          }

          output_scalar() {
            local config_path=$1
            local key=$2

            awk -v key="$key" '
              /^output:[[:space:]]*(#.*)?$/ {
                output_headers++
                in_output = 1
                next
              }
              in_output {
                if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^[[:space:]]*#/) {
                  next
                }
                if ($0 !~ /^[[:space:]]/) {
                  in_output = 0
                  next
                }

                line = $0
                sub(/^[[:space:]]+/, "", line)
                if (index(line, key ":") != 1) {
                  next
                }

                value = substr(line, length(key) + 2)
                sub(/#.*/, "", value)
                sub(/^[[:space:]]+/, "", value)
                sub(/[[:space:]]+$/, "", value)

                quote = substr(value, 1, 1)
                if (length(value) >= 2 && substr(value, length(value), 1) == quote && (quote == "\"" || quote == sprintf("%c", 39))) {
                  value = substr(value, 2, length(value) - 2)
                }

                values++
                scalar = value
              }
              END {
                if (output_headers != 1) {
                  print "rendered fine-tune config must contain exactly one output mapping" > "/dev/stderr"
                  exit 1
                }
                if (values != 1 || scalar !~ /^[A-Za-z0-9._-]+$/) {
                  print "rendered fine-tune config must contain one safe output." key " value" > "/dev/stderr"
                  exit 1
                }
                print scalar
              }
            ' "$config_path"
          }

          dataset_placeholder_count=0
          if [[ -n "$dataset_url" ]]; then
            dataset_placeholder_count=1
          fi
          render_config \
            "$source_config" \
            "$FINETUNE_CONFIG" \
            "$dataset_placeholder" \
            "$dataset_url" \
            "$dataset_placeholder_count"

          output_name=$(output_scalar "$FINETUNE_CONFIG" "name")
          output_quantize=$(output_scalar "$FINETUNE_CONFIG" "quantize")
          expected_gguf_filename="${output_name}-${output_quantize}.gguf"

          render_config \
            "$GITHUB_WORKSPACE/test/aikitfile-unsloth-custom.yaml" \
            "$CUSTOM_CONFIG" \
            "$gguf_placeholder" \
            "$expected_gguf_filename" \
            2

          echo "EXPECTED_GGUF_FILENAME=$expected_gguf_filename" >> "$GITHUB_ENV"

      - name: Build AIKit frontend
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --tag "$AIKIT_IMAGE" \
            --load \
            --provenance=false \
            --progress=plain \
            .

      - name: Build fine-tuned model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$OUTPUT_DIR"
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --allow security.insecure \
            --build-arg "nvidiaDriverVersion=$NVIDIA_DRIVER_VERSION" \
            --file "$FINETUNE_CONFIG" \
            --output "type=local,dest=$OUTPUT_DIR" \
            --target unsloth \
            --progress=plain \
            .

      - name: Verify fine-tuned model
        shell: bash
        run: |
          set -euo pipefail
          ls -al "$OUTPUT_DIR"
          test -s "$OUTPUT_DIR/$EXPECTED_GGUF_FILENAME"

      - name: Build custom model image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --tag "$CUSTOM_IMAGE" \
            --file "$CUSTOM_CONFIG" \
            --load \
            --provenance=false \
            --progress=plain \
            "$OUTPUT_DIR"

      - name: Run test model
        shell: bash
        run: |
          set -euo pipefail
          docker run \
            --name "$CONTAINER_NAME" \
            --detach \
            --publish 127.0.0.1::8080 \
            --gpus all \
            "$CUSTOM_IMAGE"

          inference_port=$(docker port "$CONTAINER_NAME" 8080/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')
          test -n "$inference_port"
          echo "INFERENCE_URL=http://127.0.0.1:${inference_port}" >> "$GITHUB_ENV"

      - name: Test inference response
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 600 \
            "$INFERENCE_URL/v1/chat/completions" \
            --header "Content-Type: application/json" \
            --data '{
              "model": "custom",
              "messages": [{"role": "user", "content": "Compose a haiku about cats"}]
            }' \
            --output "$INFERENCE_LOG_FILE"

          cat "$INFERENCE_LOG_FILE"
          jq -e '
            (.error? == null) and
            (.choices | type == "array") and
            (.choices | length > 0) and
            (.choices[0].message.content | type == "string") and
            (.choices[0].message.content | length > 0)
          ' "$INFERENCE_LOG_FILE" > /dev/null

      - name: Save container logs
        if: always()
        shell: bash
        run: |
          {
            echo "fine-tune mode: $RUN_MODE"
            if docker inspect "$CONTAINER_NAME" > /dev/null 2>&1; then
              docker logs "$CONTAINER_NAME" 2>&1 || true
            else
              echo "container $CONTAINER_NAME was not created"
            fi
          } > "$CONTAINER_LOG_FILE"

          if docker inspect "$DATASET_CONTAINER_NAME" > /dev/null 2>&1; then
            docker logs "$DATASET_CONTAINER_NAME" > "$DATASET_LOG_FILE" 2>&1 || true
          else
            echo "dataset container $DATASET_CONTAINER_NAME was not created" > "$DATASET_LOG_FILE"
          fi

      - name: Clean up run resources
        if: always()
        shell: bash
        run: |
          set +e

          docker rm --force "$DATASET_CONTAINER_NAME" > /dev/null 2>&1 || true
          docker rm --force "$CONTAINER_NAME" > /dev/null 2>&1 || true
          docker image rm --force "$CUSTOM_IMAGE" > /dev/null 2>&1 || true
          docker image rm --force "$AIKIT_IMAGE" > /dev/null 2>&1 || true

          for generated_path in "$OUTPUT_DIR" "$FINETUNE_CONFIG" "$CUSTOM_CONFIG"; do
            case "$generated_path" in
              "$RUNNER_TEMP"/*) rm -rf -- "$generated_path" || true ;;
              *) echo "refusing to remove path outside runner temp: $generated_path" >&2 ;;
            esac
          done

      - name: Publish test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fine-tune-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aikit-finetune-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}*.log
          if-no-files-found: warn
          retention-days: 7
