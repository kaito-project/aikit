name: release-runners

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-runners:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Budgets are amd64 registry-compressed image layers; attestations are excluded.
        include:
          - runner: llama-cpp-cpu
            file: runners/llama-cpp-cpu.yaml
            platforms: linux/amd64,linux/arm64
            max-compressed-mib: 175
          - runner: llama-cpp-cuda
            file: runners/llama-cpp-cuda.yaml
            platforms: linux/amd64
            max-compressed-mib: 2000
          - runner: diffusers-cuda
            file: runners/diffusers-cuda.yaml
            platforms: linux/amd64
            max-compressed-mib: 4350
          - runner: vllm-cuda
            file: runners/vllm-cuda.yaml
            platforms: linux/amd64
            max-compressed-mib: 5600
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            auth.docker.io:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            *.githubusercontent.com:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            storage.googleapis.com:443
            tuf-repo-cdn.sigstore.dev:443
            *.blob.core.windows.net:443
            *.azureedge.net:443
            developer.download.nvidia.com:443
            dl-cdn.alpinelinux.org:443
            *.ubuntu.com:80
            sum.golang.org:443
            quay.io:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kaito-project/aikit/runners/${{ matrix.runner }}
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Build and push aikit frontend
        run: |
          docker buildx build . \
            --push --provenance=false --progress plain \
            -t ghcr.io/kaito-project/aikit/aikit:${{ github.sha }}

      - name: Build and push candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-and-push
        with:
          push: true
          tags: ghcr.io/kaito-project/aikit/runners/${{ matrix.runner }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          file: ${{ matrix.file }}
          build-args: BUILDKIT_SYNTAX=ghcr.io/kaito-project/aikit/aikit:${{ github.sha }}
          cache-from: type=gha,scope=runner-${{ matrix.runner }}
          cache-to: type=gha,scope=runner-${{ matrix.runner }},mode=max
          sbom: true
          provenance: true
          platforms: ${{ matrix.platforms }}

      - name: Enforce compressed image size budget
        env:
          CANDIDATE_IMAGE: ghcr.io/kaito-project/aikit/runners/${{ matrix.runner }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          scripts/ci/check-image-size.sh \
            "${CANDIDATE_IMAGE}@${DIGEST}" \
            linux/amd64 \
            "${{ matrix.max-compressed-mib }}"

      - name: Sign the validated image with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/kaito-project/aikit/runners/${{ matrix.runner }}@${DIGEST}"

      - name: Publish release tags
        env:
          CANDIDATE_IMAGE: ghcr.io/kaito-project/aikit/runners/${{ matrix.runner }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          IMAGE_TAGS: ${{ steps.docker_meta.outputs.tags }}
        run: |
          candidate_ref="${CANDIDATE_IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker buildx imagetools create --prefer-index=false --tag "$tag" "$candidate_ref"
            fi
          done <<< "$IMAGE_TAGS"

      - name: Verify published image signatures
        env:
          IMAGE_TAGS: ${{ steps.docker_meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              cosign verify "$tag" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity "https://github.com/kaito-project/aikit/.github/workflows/release-runners.yaml@${GITHUB_REF}"
            fi
          done <<< "$IMAGE_TAGS"
