#syntax=ghcr.io/kaito-project/aikit/aikit:latest
apiVersion: v1alpha1
debug: true
runtime: cuda
backends:
  - diffusers
config: |
  - name: flux-2-klein-4b
    backend: diffusers
    parameters:
      model: black-forest-labs/FLUX.2-klein-4B
    diffusers:
      cuda: true
      enable_parameters: num_inference_steps
      pipeline_type: Flux2KleinPipeline
    cfg_scale: 1.0
    step: 4
    low_vram: true
    f16: false
    options:
      - "torch_dtype:bf16"
