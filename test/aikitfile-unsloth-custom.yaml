#syntax=aikit:test
apiVersion: v1alpha1
debug: true
runtime: cuda
models:
  - name: custom
    source: "__AIKIT_GGUF_OUTPUT__"
    promptTemplates:
    - name: instruct
      template: |
        Below is an instruction that describes a task. Write a response that appropriately completes the request.

        ### Instruction:
        {{.Input}}

        ### Response:
config: |
  - name: custom
    backend: llama
    parameters:
      model: "__AIKIT_GGUF_OUTPUT__"
    context_size: 4096
    f16: true
    mmap: true
    template:
      chat: instruct
